version: "3.7"

# Stack do catálogo/orçamento Anil para Docker Swarm (Portainer)
# Antes de subir: crie o registro DNS  catalogo.anilpiscinas.com.br  ->  5.161.48.106
# e troque os valores marcados com TROCAR.

services:
  catalogo:
    image: ghcr.io/thaisalpino01/catalog-anil:latest
    volumes:
      - catalogo_data:/data
    networks:
      - network_swarm_public
    environment:
      - PUBLIC_URL=https://catalogo.anilpiscinas.com.br
      - ADMIN_USER=anil
      - ADMIN_PASSWORD=TROCAR
      - SESSION_SECRET=TROCAR
      - WHATSAPP_PADRAO=553799261553
      - N8N_WEBHOOK_URL=
      - N8N_WEBHOOK_TOKEN=
      - PRICE_SYNC_TOKEN=TROCAR
      - CODE_PREFIX=ANL
      - TZ=America/Sao_Paulo
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_swarm_public
        - traefik.http.routers.catalogo_anil.rule=Host(`catalogo.anilpiscinas.com.br`)
        - traefik.http.routers.catalogo_anil.entrypoints=websecure
        - traefik.http.routers.catalogo_anil.tls.certresolver=letsencryptresolver
        - traefik.http.routers.catalogo_anil.service=catalogo_anil
        - traefik.http.services.catalogo_anil.loadbalancer.server.port=3000
        - traefik.http.services.catalogo_anil.loadbalancer.passHostHeader=true

volumes:
  catalogo_data:

networks:
  network_swarm_public:
    external: true
    name: network_swarm_public
